note: >-
  NOTHING OF ELIGIBLE'S WAS FOUND. Every /.well-known/ path on every Eligible-controlled
  host returns 403 (CloudFront) or 404. NO WellKnown, SecurityTxt, APICatalog or
  AgentCard pointer is emitted from this file — this artifact records a measured
  absence, not a presence. Recorded so a later run does not re-probe blind.
  On the 403s: eligible.com and gds.eligibleapi.com sit behind CloudFront and answer 403
  to any path that is not a real route. Two things were re-tested on 2026-08-15 to be
  sure the 403 was not an artifact of our client: (a) adding a same-origin Referer,
  which changed nothing on any /.well-known/ path, and (b) the same header pair applied
  to https://eligible.com/resources/payers/*.json, which DID flip those from 403 to 200.
  So the 403 on these paths is "no such document", not "blocked from a document that
  exists" — proved by finding real documents on the same host with the same client.
