  note: >-
    The best-instrumented public surface Eligible has. It is also a useful
    architecture disclosure: the components confirm a separately-tracked Sandbox
    environment, an "Insurance Connections" payer-network tier, and AWS us-east
    hosting with Cognito in the identity path.
