changelog:
  api_changelog_url: null
  note: >-
    Eligible publishes no dated API changelog. Release notification is by direct
    customer contact ("we will always notify our clients"). The only public dated
    release record is the SDK changelog shipped inside the Ruby gem, which is a client
    changelog and not an API one.
  sdk_release_cadence:
    pattern: >-
      Roughly one release per January across the Ruby, Node, .NET and Java clients.
      The Ruby CHANGELOG shows why: almost every entry reads "Updated pinned GDS SSL
      certificate". The clients pin the API host's certificate fingerprint, so the
      annual release is a certificate rotation, not a feature release.
    entries:
      - version: 3.0.3
        date: '2026-01-15'
        highlights: Updated pinned GDS SSL certificate
      - version: 3.0.2
        date: '2025-01-20'
        highlights: Updated pinned GDS SSL certificate
      - version: 3.0.1
        date: '2025-01-16'
        highlights: Updated pinned GDS SSL certificate
      - version: 3.0.0
        date: '2024-01-17'
        highlights: Add support for Ruby 3 versions
      - version: 2.9.15
        date: '2024-01-11'
        highlights: Updated pinned GDS SSL certificate
    source: rubygems:eligible@3.0.3 CHANGELOG.md
