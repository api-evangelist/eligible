method: searched
source: >-
  https://status.eligible.com/ (+ its Statuspage API at /api/v2/summary.json, probed
  anonymously 2026-08-14), https://eligible.com/community/technical-features-faq/, and
  the published CHANGELOG of rubygems.org eligible 3.0.3.
versioning:
  scheme: uri-path
  current: v1.5
  base: https://gds.eligibleapi.com/v1.5
  stable_since: '2016'
  policy_url: https://eligible.com/community/technical-features-faq/
  policy: >-
    "We keep the version of the API in the query string, so that version will not
    change and your code should not break because of API changes. Eligible's
    documentation will reflect new releases, and we will always notify our clients
    when new releases are available." A pinned-version compatibility promise, with
    release notification by direct customer contact rather than by a public changelog.
deprecation:
  api_policy: null
  sunset_header: false
  note: >-
    NO PUBLISHED API DEPRECATION POLICY and no RFC 8594 Sunset/Deprecation header
    support in either first-party client. What Eligible does publish is a DATA
    deprecation policy, for payer identifiers — a different thing, and not scored as
    an API deprecation policy here.
  data_deprecation:
    subject: payer_id
    policy: >-
      Eligible consolidated onto one standardized payer ID per payer (previously a
      payer could carry different IDs per transaction type). Superseded IDs are
      retained indefinitely: "we continue to support our deprecated payer list. Our
      customers can still use deprecated payer IDs. Our system will convert the
      deprecated payer IDs and process the transaction as expected." Responses carry
      both `payer_id` and `deprecated_payer_id`. Deprecated IDs are hidden from
      https://eligible.com/network but remain live.
    migration_advice: >-
      Eligible recommends upgrading to the latest payer list to gain the newer payer
      management endpoints (payer listing, status, webhooks).
    source: https://eligible.com/community/technical-features-faq/
