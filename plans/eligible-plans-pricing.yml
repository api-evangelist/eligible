specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Eligible
providerId: eligible
created: '2026-05-04'
modified: '2026-08-15'
generated: '2026-08-15'
method: searched
reconciled: true
source: https://eligible.com/pricing
sources:
  - https://eligible.com/pricing
  - https://eligible.com/resources/payers/coverage_passthrough.json
  - https://eligible.com/resources/payers/claims_passthrough.json
  - https://eligible.com/resources/payers/payment_status_passthrough.json
