agent_readiness_note: >-
  The blocker here is not the missing server, it is the missing contract. There is no
  OpenAPI to generate tools from and no public JSON Schema for any transactional entity,
  so a generated tool's inputSchema would have to be authored by hand from prose. That
  is why every tool below is marked with the operation it would wrap rather than with a
  schema.
tools:
  - name: check_coverage
    description: Run a real-time 270/271 eligibility and benefits check for a member against a payer.
    source_operation: GET /coverage/all.json
    requires: [npi, payer_id, member_id, member_first_name, member_last_name, member_dob]
    consequence: read
  - name: estimate_patient_cost
    description: Calculate expected patient out-of-pocket cost — deductible, coinsurance, copay, stop loss.
    source_operation: GET /coverage/cost_estimates.json
    consequence: read
  - name: check_medicare_coverage
    description: Run a Medicare-specific coverage inquiry.
    source_operation: GET /medicare/coverage.json
    consequence: read
  - name: verify_demographics
    description: Verify member demographic information against the payer.
    source_operation: GET /demographic/all.json
    consequence: read
  - name: list_payers
    description: List the insurance payers Eligible transacts with and their capabilities.
    source_operation: GET /payers.json
    public_alternative: https://eligible.com/resources/payers/eligibility.json
    consequence: read
  - name: get_payer_search_options
    description: Get the member-identity field combinations one payer accepts for a coverage request.
    source_operation: GET /payers/{payer_id}/search_options
    public_alternative: https://eligible.com/resources/payers/eligibility/search-options.json
    consequence: read
  - name: submit_claim
    description: Submit an 837 professional or institutional claim to a payer.
    source_operation: POST /claims.json
    consequence: write
    escalation: required
    escalation_reason: >-
      A duplicate call is a duplicate claim to a real insurer, and this API has NO
      idempotency contract (see conventions/). Any agent binding this tool must gate it
      behind explicit human confirmation.
  - name: get_claim_acknowledgements
    description: Retrieve payer acceptance or rejection for a submitted claim.
    source_operation: GET /claims/{reference_id}/acknowledgements.json
    consequence: read
  - name: get_payment_reports
    description: Retrieve 835 remittance advice for a claim.
    source_operation: GET /claims/{reference_id}/payment_reports
    consequence: read
  - name: get_payment_status
    description: Check 276/277 claim status.
    source_operation: GET /payment/status.json
    consequence: read
  - name: list_enrollments
    description: List trading-partner enrollments for provider NPIs.
    source_operation: GET /enrollment_npis.json
    consequence: read
  - name: create_enrollment
    description: Submit a trading-partner enrollment request for a provider NPI with a payer.
    source_operation: POST /enrollment_npis.json
    consequence: write
    escalation: required
  - name: check_precert_required
    description: Check whether a service requires pre-certification.
    source_operation: GET /precert/require.json
    consequence: read
  - name: create_precert
    description: Submit a pre-certification / prior-authorization request.
    source_operation: POST /precert/create.json
    consequence: write
    escalation: required
  - name: search_icd_codes
    description: Search ICD codes, describe a code, or crosswalk between ICD-9 and ICD-10.
    source_operation: GET /icds/{type}, /icds/{type}/describe/{code}, /icds/{type}/crosswalk/{code}
    consequence: read
  - name: scan_insurance_card
    description: OCR an insurance card image into structured member identity fields.
    source_operation: POST /card_scans.json
    consequence: write
    note: Multipart upload of a photograph of a patient's insurance card — PHI on the wire.
