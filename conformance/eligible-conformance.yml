note: >-
  Eligible is a HIPAA-covered clearinghouse, so its conformance story is a healthcare
  operating-rules story rather than a web-API-standards story. It holds real,
  dated, third-party-attested certifications for the transaction rails — and holds
  essentially nothing on the API-contract side, because it publishes no
  machine-readable specification at all. Both halves are recorded below.
