summary:
  entities: 28
  operations_reconstructed: 65
  resource_classes_in_client: 22
  entities_with_public_schema: 4
  observation: >-
    Sixty-five operations across twenty-eight entities, and public field-level schemas
    for exactly four of them — all four being payer reference data rather than
    transactional objects. The workflow spine is Enrollment -> Coverage -> Claim ->
    ClaimAcknowledgement -> PaymentReport, and enrollment is the gate: a claim cannot
    flow until the provider NPI is enrolled with the payer, which is why the 401 on this
    API means either "bad key" or "not enrolled" and does not distinguish them.
